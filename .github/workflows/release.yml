name: Release Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from git tags
        id: v
        run: |
          # Versioning scheme (after 0.1.101): 1.{MINOR}.{PATCH}
          #   PATCH increments each commit from 0 to 99, then rolls back to 0
          #   and MINOR increments: 1.0.0 → 1.0.99 → 1.1.0 → 1.1.99 → 1.2.0 …
          # Highest semver tag, NOT git describe: describe can return a stale
          # tag when two tags sit on the same commit, causing collisions.
          LAST=$(git tag --sort=-v:refname | head -n1 || true)
          BASE="${LAST#v}"
          BASE=${BASE:-0.0.0}
          MAJ=$(echo "$BASE" | cut -d. -f1)
          if [ "$MAJ" = "0" ]; then
            # Still on the legacy 0.x scheme → switch to 1.0.0
            VER_MAJ=1
            VER_MIN=0
            VER_PATCH=0
          else
            # Commits since the highest tag = the auto-increment at each commit
            if [ -z "$LAST" ]; then
              COUNT=$(git rev-list --count HEAD 2>/dev/null)
            else
              COUNT=$(git rev-list --count HEAD --not "$LAST" 2>/dev/null)
            fi
            COUNT=${COUNT:-0}
            MIN=$(echo "$BASE" | cut -d. -f2)
            PATC=$(echo "$BASE" | cut -d. -f3)
            INC=$((PATC + COUNT))
            VER_MAJ=1
            VER_MIN=$((MIN + INC / 100))
            VER_PATCH=$((INC % 100))
          fi
          # Android versionCode MUST strictly increase between releases or the
          # update is rejected as a downgrade/same-version. Total commit count
          # is monotonic (the per-release delta was 1 every time, so every APK
          # shipped versionCode=1). Use total commits for `build`.
          TOTAL=$(git rev-list --count HEAD 2>/dev/null)
          TOTAL=${TOTAL:-0}
          echo "version=${VER_MAJ}.${VER_MIN}.${VER_PATCH}" >> "$GITHUB_OUTPUT"
          echo "build=${TOTAL}" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK (signed)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build signed release APK
        run: flutter build apk --release --target-platform android-arm64 --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargolink-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  android-aab:
    name: Android App Bundle (Play Store)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build signed release App Bundle
        run: flutter build appbundle --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargolink-aab
          path: build/app/outputs/bundle/release/app-release.aab

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    env:
      CARGOLINK_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Create installer
        run: iscc installer\windows\cargolink.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargolink-windows-installer
          path: installer/windows/Output/*.exe

  web:
    name: Web build
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Write version.json
        # Clé `build_number` : format attendu par package_info_plus sur le web.
        run: |
          echo "{\"version\":\"${{ needs.version.outputs.version }}\",\"build_number\":\"${{ needs.version.outputs.build }}\"}" > build/web/version.json

      - name: Zip web build
        run: cd build/web && zip -r ../../cargolink-web.zip . && cd ../..

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargolink-web
          path: cargolink-web.zip

  # ============================================================================
  # iOS — IPA signé (App Store / TestFlight)
  # ----------------------------------------------------------------------------
  # Un build iOS SIGNÉ ne peut se faire que sur un runner macOS (présence de
  # Xcode). Le job importe un certificat de distribution (.p12) dans le trousseau
  # de la CI, installe le provisioning profile de distribution App Store, génère
  # l'ExportOptions.plist et produit un `.ipa` prêt à monter sur App Store Connect.
  #
  # 🗝️ SECRETS GITHUB NÉCESSAIRES (Settings → Secrets and variables → Actions) :
  #
  #   IOS_CERTIFICATE_P12_BASE64
  #       Le fichier du certificat de distribution (.p12) encodé en base64.
  #       Générer depuis Keychain : clic droit sur le certificat + clé privée →
  #       « Export » (Apple Distribution …) → exporter au format .p12 puis :
  #         base64 -i AppleDistribution.p12   (Linux/macOS) |  certutil + PowerShell
  #         $c=[Convert]::ToBase64String([IO.File]::ReadAllBytes("AppleDistribution.p12"))
  #
  #   IOS_CERTIFICATE_PASSWORD
  #       Le mot de passe du fichier .p12 (celui saisi à l'export).
  #
  #   IOS_PROVISIONING_PROFILE_BASE64
  #       Le profil de distribution « App Store » (bundle ID
  #       `com.cargolink.dz.cargolink`) encodé en base64.
  #       Sur developer.apple.com → Certificates/Profiles → App Store Distribution
  #       profile (type « App Store ») pour l'App ID `com.cargolink.dz.cargolink`,
  #       téléchargé en .mobileprovision puis : `base64 -i profile.mobileprovision`.
  #
  #   IOS_TEAM_ID
  #       Votre Team ID Apple (identifiant type « ABCD1234EF », visible sur
  #       developer.apple.com → Membership). Sert à l'ExportOptions.plist.
  #
  #   IOS_KEYCHAIN_PASSWORD
  #       Mot de passe temporaire du trousseau créé dans la CI (n'importe quelle
  #       chaîne aléatoire ; sert uniquement à verrouiller le trousseau éphémère).
  #
  # ⚠️ Compatibilité certificat/profil :
  #   - Utiliser un CERTIFICAT DE DISTRIBUTION (pas un certificat de dev).
  #   - Le provisioning profile doit être de type « App Store » et couvrir le
  #     bundle ID `com.cargolink.dz.cargolink` avec votre Team ID.
  #   - Sans quoi Xcode refuse l'export « app-store-connect » et le build échoue.
  # ============================================================================
  ios:
    name: iOS IPA (App Store / TestFlight)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod repo update || true
          pod install
          cd ..

      - name: Import Apple Distribution certificate
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN" || true

      - name: Install App Store provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Write ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.IOS_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Build signed Release IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargolink-ipa
          path: build/ios/ipa/*.ipa

  release:
    name: Publish GitHub Release
    needs: [version, android, android-aab, windows, web, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false