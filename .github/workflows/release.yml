name: Release Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from git tags
        id: v
        run: |
          # Highest semver tag, NOT git describe: describe can return a stale tag
          # when two tags sit on the same commit, causing version collisions.
          LAST=$(git tag --sort=-v:refname | head -n1 || true)
          BASE="${LAST#v}"
          BASE=${BASE:-0.0.0}
          MAJ=$(echo "$BASE" | cut -d. -f1)
          MIN=$(echo "$BASE" | cut -d. -f2)
          PATC=$(echo "$BASE" | cut -d. -f3)
          # Commits since the highest tag = the auto-increment at each commit
          if [ -z "$LAST" ]; then
            COUNT=$(git rev-list --count HEAD 2>/dev/null)
          else
            COUNT=$(git rev-list --count HEAD --not "$LAST" 2>/dev/null)
          fi
          COUNT=${COUNT:-0}
          NEW_PATCH=$((PATC + COUNT))
          # Android versionCode MUST strictly increase between releases or the
          # update is rejected as a downgrade/same-version. Total commit count
          # is monotonic (the per-release delta was 1 every time, so every APK
          # shipped versionCode=1). Use total commits for `build`.
          TOTAL=$(git rev-list --count HEAD 2>/dev/null)
          TOTAL=${TOTAL:-0}
          echo "version=${MAJ}.${MIN}.${NEW_PATCH}" >> "$GITHUB_OUTPUT"
          echo "build=${TOTAL}" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK (signed)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build signed release APK
        run: flutter build apk --release --target-platform android-arm64 --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargolink-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  android-aab:
    name: Android App Bundle (Play Store)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build signed release App Bundle
        run: flutter build appbundle --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargolink-aab
          path: build/app/outputs/bundle/release/app-release.aab

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    env:
      CARGOLINK_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Create installer
        run: iscc installer\windows\cargolink.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargolink-windows-installer
          path: installer/windows/Output/*.exe

  web:
    name: Web build
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Write version.json
        run: |
          echo "{\"version\":\"${{ needs.version.outputs.version }}\",\"build\":${{ needs.version.outputs.build }}}" > build/web/version.json

      - name: Zip web build
        run: cd build/web && zip -r ../../cargolink-web.zip . && cd ../..

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargolink-web
          path: cargolink-web.zip

  release:
    name: Publish GitHub Release
    needs: [version, android, android-aab, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false