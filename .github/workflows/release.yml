name: Release Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.0
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  android:
    name: Android APK (signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargolink-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --dart-define=SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}

      - name: Create installer
        run: iscc installer\windows\cargolink.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargolink-windows-installer
          path: installer/windows/Output/*.exe

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release --dart-define=SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargolink-web
          path: build/web

  release:
    name: Publish GitHub Release
    needs: [android, windows, web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true