name: Deploy Privacy Policy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "docs/privacy_policy.html"
      - "docs/privacy_policy.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp docs/privacy_policy.html _site/index.html
          cp docs/privacy_policy.md _site/politique-de-confidentialite.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4