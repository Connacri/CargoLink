name: cargolink
description: "Plateforme de logistique pour micro-importateurs en Algérie"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Supabase
  supabase_flutter: ^1.10.0
  supabase: ^1.10.0

  # Authentication
  google_sign_in: ^6.1.0
  sign_in_with_apple: ^5.0.0

  # Networking
  http: ^1.1.0
  dio: ^5.3.0

  path: ^1.9.0

  # Location & Maps
  geolocator: ^9.0.2
  google_maps_flutter: ^2.5.0
  location: ^5.0.0

  # Camera & Image
  camera: ^0.10.5
  image_picker: ^1.0.0
  image: ^4.0.0

  # Storage
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # Notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0
  flutter_local_notifications: ^14.1.0

  # Payment
  pay: ^1.1.0

  # Date & Time
  intl: ^0.20.2
  timezone: ^0.9.0

  # UI/UX
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  dotted_border: ^2.1.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  modal_bottom_sheet: ^2.1.0
  pull_to_refresh: ^2.0.0

  # Forms & Validation

  # Utils
  uuid: ^4.0.0
  logger: ^2.1.0
  package_info_plus: ^5.0.0
  connectivity_plus: ^5.0.0
  permission_handler: ^11.4.0
  url_launcher: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
