name: cargolink
description: "Plateforme de logistique pour micro-importateurs en Algérie"
publish_to: 'none'

version: 1.1.42+268

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Supabase
  supabase_flutter: ^2.17.1
  supabase: ^2.16.0

  # Authentication
  google_sign_in: ^6.3.0

  # Networking
  http: ^1.1.0
  dio: ^5.3.0

  path: ^1.9.0

  # Location & Maps
  geolocator: ^9.0.2
  google_maps_flutter: ^2.5.0
  location: ^5.0.0

  # Airports (recherche mondiale départ/arrivée)
  airport_data: ^1.0.2
  font_awesome_flutter: ^11.0.0
  country_flags: ^4.1.2

  # Camera & Image
  camera: ^0.10.5
  file_picker: ^8.0.0
  image: ^4.0.0

  # Storage
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # Notifications
  flutter_local_notifications: ^19.0.0

  # Payment

  # Date & Time
  intl: ^0.20.2
  timezone: ^0.10.0
  # Localizations (DatePicker/built-in Material strings in French)
  flutter_localizations:
    sdk: flutter

  # UI/UX
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  dotted_border: ^2.1.0
  shimmer: ^3.0.0
  lottie: 3.5.1
  modal_bottom_sheet: ^2.1.0
  pull_to_refresh: ^2.0.0

  # User feedback (annotated screenshot + text) — sent to the founder
  feedback: ^3.2.0

  # Partage natif (code parrain, offre, lien Play Store)
  share_plus: ^10.0.0

  # Forms & Validation

  # Utils
  uuid: ^4.0.0
  logger: ^2.1.0
  package_info_plus: ^8.0.0
  connectivity_plus: ^5.0.0
  permission_handler: ^11.4.0
  url_launcher: ^6.1.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_messaging: ^16.5.0
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  qr_flutter: ^4.1.0
  gal: ^2.3.3
  mobile_scanner: ^7.4.0
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.0

  # App icon generation (run: dart run flutter_launcher_icons)
  flutter_launcher_icons: ^0.14.3

  # Splash screen generation (run: dart run flutter_native_splash:create)
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Bold.ttf
        - asset: assets/fonts/Oswald-ExtraLight.ttf
        - asset: assets/fonts/Oswald-SemiBold.ttf
        - asset: assets/fonts/Oswald-Regular.ttf
        - asset: assets/fonts/Oswald-Light.ttf
        - asset: assets/fonts/Oswald-Medium.ttf
    - family: ArbFONTS
      fonts:
        - asset: assets/fonts/ArbFONTS-khalaad-al-arabeh.ttf
        - asset: assets/fonts/ArbFONTS-Al-Jazeera-Arabic-Bold.ttf
        - asset: assets/fonts/ArbFONTS-Al-Jazeera-Arabic-Bold-1.ttf
        - asset: assets/fonts/ArbFONTS-Al-Jazeera-Arabic-Light.ttf
        - asset: assets/fonts/ArbFONTS-Al-Jazeera-Arabic-Regular.ttf
        - asset: assets/fonts/NizarBBCKurdish-Bold.ttf
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

# App icon configuration. Place your high-res logo at assets/icons/icon2.png
# then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon2.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/icons/icon2.png"
  min_sdk_android: 21

# Splash screen configuration. Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/splash3.jpeg

  android: true
  ios: true
  web: true

  fullscreen: true

  android_12:
    color: "#FFFFFF"
    image: assets/icons/splash3.jpeg

dependency_overrides:
  sign_in_with_apple: ^8.1.0

