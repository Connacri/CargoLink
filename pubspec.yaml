name: cargolink
description: "Plateforme de logistique pour micro-importateurs en Algérie"
publish_to: 'none'

version: 0.1.28+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Supabase
  supabase_flutter: ^2.17.1
  supabase: ^2.16.0

  # Authentication
  google_sign_in: ^6.3.0

  # Networking
  http: ^1.1.0
  dio: ^5.3.0

  path: ^1.9.0

  # Location & Maps
  geolocator: ^9.0.2
  google_maps_flutter: ^2.5.0
  location: ^5.0.0

  # Camera & Image
  camera: ^0.10.5
  file_picker: ^8.0.0
  image: ^4.0.0
  google_mlkit_face_detection: ^0.13.0
  google_mlkit_commons: ^0.11.0

  # Storage
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # Notifications
  flutter_local_notifications: ^19.0.0

  # Payment

  # Date & Time
  intl: ^0.20.2
  timezone: ^0.10.0

  # UI/UX
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  dotted_border: ^2.1.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  modal_bottom_sheet: ^2.1.0
  pull_to_refresh: ^2.0.0

  # User feedback (annotated screenshot + text) — sent to the founder
  feedback: ^3.2.0

  # Forms & Validation

  # Utils
  uuid: ^4.0.0
  logger: ^2.1.0
  package_info_plus: ^8.0.0
  connectivity_plus: ^5.0.0
  permission_handler: ^11.4.0
  url_launcher: ^6.1.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_messaging: ^16.5.0
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  image_picker: ^1.2.3
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

dependency_overrides:
  sign_in_with_apple: ^8.1.0
